<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flow Platform - Mobile Calendar Picker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #0b0f17;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      color: #0f172a;
    }
    .phone-frame {
      width: 393px;
      height: 852px;
      background-color: rgba(11, 15, 23, 0.75);
      backdrop-filter: blur(10px);
      border-radius: 48px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      position: relative;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.7), 0 0 0 10px #1e1e24, 0 0 0 12px #334155;
    }
    /* Bottom Sheet Modal Container matching media_1790067336876.png */
    .calendar-modal {
      background: #ffffff;
      border-top-left-radius: 28px;
      border-top-right-radius: 28px;
      padding: 16px 18px 24px 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 -12px 35px rgba(0, 0, 0, 0.3);
    }
    /* Preset Chips matching screenshot */
    .presets-row {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 2px;
    }
    .presets-row::-webkit-scrollbar {
      display: none;
    }
    .preset-pill {
      background: #f1f5f9;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 7px 12px;
      font-size: 11.5px;
      font-weight: 700;
      color: #334155;
      white-space: nowrap;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.15s;
    }
    .preset-pill.active {
      background: #eff6ff;
      border-color: #bfdbfe;
      color: #1d4ed8;
    }

    /* Drag Handle */
    .modal-handle {
      width: 48px;
      height: 4px;
      background: #cbd5e1;
      border-radius: 999px;
      margin: 0 auto;
    }

    /* Month Navigation Header */
    .month-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 4px;
    }
    .month-name {
      font-size: 17px;
      font-weight: 800;
      color: #0f172a;
    }
    .month-year {
      color: #64748b;
      font-weight: 600;
    }
    .nav-arrow-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: #334155;
      padding: 6px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .nav-arrow-btn svg {
      width: 16px;
      height: 16px;
    }

    /* Weekday Labels */
    .weekday-row {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      font-size: 12px;
      font-weight: 700;
      color: #64748b;
      padding-bottom: 4px;
      border-bottom: 1px solid #f1f5f9;
    }

    /* Calendar Days Grid */
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      row-gap: 8px;
      column-gap: 6px;
      text-align: center;
    }
    .day-cell {
      height: 38px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 700;
      color: #1e293b;
      cursor: pointer;
      transition: all 0.15s;
    }
    .day-cell.muted {
      color: #cbd5e1;
      cursor: default;
    }
    .day-cell.selected-circle {
      background-color: #2563eb;
      color: #ffffff;
      border-radius: 50%;
      box-shadow: 0 2px 6px rgba(37, 99, 235, 0.35);
    }
    .day-cell.in-range {
      background-color: #eff6ff;
      color: #1d4ed8;
      border-radius: 8px;
    }

    /* Legend Row matching screenshot */
    .legend-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      padding: 6px 0;
      font-size: 11px;
      font-weight: 600;
      color: #64748b;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .legend-icon {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }
    .legend-icon.selected {
      background-color: #2563eb;
    }
    .legend-icon.in-range {
      border: 1.5px solid #2563eb;
      background-color: transparent;
    }
    .legend-icon.today {
      border: 1.5px solid #f59e0b;
      background-color: transparent;
    }

    /* Modal Action Buttons */
    .modal-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid #f1f5f9;
      padding-top: 12px;
      margin-top: 2px;
    }
    .reset-btn {
      background: none;
      border: none;
      color: #64748b;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      padding: 6px 12px;
    }
    .reset-btn:hover {
      color: #0f172a;
    }
    .apply-btn {
      background-color: #2563eb;
      color: #ffffff;
      font-size: 13px;
      font-weight: 700;
      padding: 9px 26px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.3);
      transition: background-color 0.15s;
    }
    .apply-btn:hover {
      background-color: #1d4ed8;
    }
  </style>
</head>
<body>

  <div class="phone-frame">
    <!-- Bottom Sheet Modal matching media_1790067336876.png -->
    <div class="calendar-modal">
      <!-- Quick Presets -->
      <div class="presets-row">
        <button class="preset-pill">All Dates</button>
        <button class="preset-pill active">Sep 2026 (Current)</button>
        <button class="preset-pill">Aug 2026</button>
        <button class="preset-pill">Jul 2026</button>
      </div>

      <!-- Drag Handle -->
      <div class="modal-handle"></div>

      <!-- Month Navigation Header -->
      <div class="month-header">
        <button class="nav-arrow-btn" title="Previous Month">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
        </button>
        <span class="month-name">September <span class="month-year">2026</span></span>
        <button class="nav-arrow-btn" title="Next Month">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
        </button>
      </div>

      <!-- Weekday Headers -->
      <div class="weekday-row">
        <span>M</span>
        <span>T</span>
        <span>W</span>
        <span>T</span>
        <span>F</span>
        <span>S</span>
        <span>S</span>
      </div>

      <!-- Days Grid (2-digit format, exact match to screenshot) -->
      <div class="calendar-grid">
        <!-- Row 1 -->
        <div class="day-cell muted">31</div>
        <div class="day-cell selected-circle">01</div>
        <div class="day-cell in-range">02</div>
        <div class="day-cell in-range">03</div>
        <div class="day-cell in-range">04</div>
        <div class="day-cell in-range">05</div>
        <div class="day-cell in-range">06</div>

        <!-- Row 2 -->
        <div class="day-cell in-range">07</div>
        <div class="day-cell in-range">08</div>
        <div class="day-cell in-range">09</div>
        <div class="day-cell in-range">10</div>
        <div class="day-cell in-range">11</div>
        <div class="day-cell in-range">12</div>
        <div class="day-cell in-range">13</div>

        <!-- Row 3 -->
        <div class="day-cell in-range">14</div>
        <div class="day-cell in-range">15</div>
        <div class="day-cell in-range">16</div>
        <div class="day-cell in-range">17</div>
        <div class="day-cell in-range">18</div>
        <div class="day-cell in-range">19</div>
        <div class="day-cell in-range">20</div>

        <!-- Row 4 -->
        <div class="day-cell in-range">21</div>
        <div class="day-cell in-range">22</div>
        <div class="day-cell in-range">23</div>
        <div class="day-cell in-range">24</div>
        <div class="day-cell in-range">25</div>
        <div class="day-cell in-range">26</div>
        <div class="day-cell in-range">27</div>

        <!-- Row 5 -->
        <div class="day-cell in-range">28</div>
        <div class="day-cell in-range">29</div>
        <div class="day-cell selected-circle">30</div>
        <div class="day-cell muted">01</div>
        <div class="day-cell muted">02</div>
        <div class="day-cell muted">03</div>
        <div class="day-cell muted">04</div>
      </div>

      <!-- Legend Row -->
      <div class="legend-row">
        <div class="legend-item">
          <span class="legend-icon selected"></span>
          <span>Selected</span>
        </div>
        <div class="legend-item">
          <span class="legend-icon in-range"></span>
          <span>In Range</span>
        </div>
        <div class="legend-item">
          <span class="legend-icon today"></span>
          <span>Today</span>
        </div>
      </div>

      <!-- Action Buttons Row -->
      <div class="modal-actions">
        <button class="reset-btn" onclick="location.href='mobile-invoice-list.html'">Reset</button>
        <button class="apply-btn" onclick="location.href='mobile-invoice-list.html'">Apply</button>
      </div>
    </div>
  </div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flow Platform - Navigation Drawer Pop-Up (Figma 1123:8991)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #0b0f17;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      color: #0f172a;
    }
    .phone-frame {
      width: 393px;
      height: 852px;
      background-color: #f8f9ff;
      border-radius: 48px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.7), 0 0 0 10px #1e1e24, 0 0 0 12px #334155;
    }

    /* Dimmed underlying screen */
    .underlying-screen {
      flex: 1;
      padding: 16px;
      opacity: 0.35;
      pointer-events: none;
      filter: blur(1.5px);
    }
    .fake-header { height: 48px; background: #1e1e24; border-radius: 12px; margin-bottom: 16px; }
    .fake-card { height: 120px; background: #ffffff; border: 1px solid #e2e8f0; border-radius: 16px; margin-bottom: 12px; }

    /* Drawer Backdrop Overlay */
    .drawer-overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(4px);
      z-index: 50;
      display: flex;
      animation: fadeIn 0.2s ease-out;
    }

    /* Off-canvas Navigation Drawer */
    .drawer-panel {
      width: 310px;
      height: 100%;
      background: #ffffff;
      box-shadow: 10px 0 30px rgba(0, 0, 0, 0.25);
      display: flex;
      flex-direction: column;
      animation: slideIn 0.28s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 60;
    }

    /* Drawer Header with User Profile */
    .drawer-header {
      background: #1e1e24;
      color: #ffffff;
      padding: 32px 20px 20px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom-right-radius: 24px;
    }
    .user-profile {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .avatar {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      background: #10b981;
      color: #ffffff;
      font-size: 16px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(16, 185, 129, 0.35);
    }
    .user-name { font-size: 15px; font-weight: 700; color: #ffffff; }
    .user-role { font-size: 11.5px; color: #94a3b8; margin-top: 1px; }

    .drawer-close {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .drawer-close svg { width: 18px; height: 18px; }

    /* Navigation Links Body */
    .drawer-body {
      flex: 1;
      overflow-y: auto;
      padding: 18px 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .drawer-body::-webkit-scrollbar { display: none; }

    .nav-category {
      font-size: 10.5px;
      font-weight: 700;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 10px 10px 4px 10px;
    }

    .nav-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      border-radius: 12px;
      color: #334155;
      text-decoration: none;
      font-size: 13.5px;
      font-weight: 600;
      transition: all 0.15s;
    }
    .nav-link:hover {
      background: #f1f5f9;
      color: #0f172a;
    }
    .nav-link.active {
      background: #ecfdf5;
      color: #059669;
      font-weight: 700;
    }
    .nav-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .nav-left svg {
      width: 18px;
      height: 18px;
      color: currentColor;
    }
    .nav-badge {
      font-size: 10px;
      font-weight: 700;
      background: #10b981;
      color: #ffffff;
      padding: 2px 7px;
      border-radius: 8px;
    }

    /* Drawer Footer */
    .drawer-footer {
      padding: 16px 14px;
      border-top: 1px solid #f1f5f9;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .logout-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 12px;
      color: #ef4444;
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
      background: none;
      border: none;
      width: 100%;
      cursor: pointer;
    }
    .logout-btn svg { width: 18px; height: 18px; }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideIn { from { transform: translateX(-100%); } to { transform: translateX(0); } }
  </style>
</head>
<body>

  <div class="phone-frame">
    <!-- Underlay for backdrop demo -->
    <div class="underlying-screen">
      <div class="fake-header"></div>
      <div class="fake-card"></div>
      <div class="fake-card"></div>
      <div class="fake-card"></div>
    </div>

    <!-- Interactive Navigation Drawer Pop-Up -->
    <div class="drawer-overlay" id="drawerOverlay" onclick="closeDrawer(event)">
      <div class="drawer-panel" onclick="event.stopPropagation()">
        
        <!-- Drawer Header with Profile -->
        <div class="drawer-header">
          <div class="user-profile">
            <div class="avatar">FP</div>
            <div>
              <div class="user-name">Flow Admin</div>
              <div class="user-role">Derby County Operations</div>
            </div>
          </div>
          <button class="drawer-close" title="Close Drawer" onclick="closeDrawer()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>

        <!-- Navigation Links Body -->
        <div class="drawer-body">
          <div class="nav-category">Main Overview</div>

          <a href="mobile-stitch-export.html" class="nav-link">
            <div class="nav-left">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                <polyline points="9 22 9 12 15 12 15 22"></polyline>
              </svg>
              <span>Impact Savings</span>
            </div>
          </a>

          <a href="mobile-stock-check.html" class="nav-link">
            <div class="nav-left">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"></path>
                <path d="m3.3 7 8.7 5 8.7-5"></path>
                <path d="M12 22V12"></path>
              </svg>
              <span>Stock Check</span>
            </div>
            <span class="nav-badge">150</span>
          </a>

          <div class="nav-category">Invoicing &amp; Billing</div>

          <a href="mobile-invoice-list.html" class="nav-link active">
            <div class="nav-left">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                <polyline points="14 2 14 8 20 8"></polyline>
                <line x1="16" y1="13" x2="8" y2="13"></line>
                <line x1="16" y1="17" x2="8" y2="17"></line>
              </svg>
              <span>Invoice List</span>
            </div>
            <span class="nav-badge">4</span>
          </a>

          <a href="mobile-generate-invoice.html" class="nav-link">
            <div class="nav-left">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="8" x2="12" y2="16"></line>
                <line x1="8" y1="12" x2="16" y2="12"></line>
              </svg>
              <span>Generate Invoice</span>
            </div>
          </a>

          <a href="mobile-services.html" class="nav-link">
            <div class="nav-left">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect>
                <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
              </svg>
              <span>Services &amp; Rates</span>
            </div>
          </a>

          <div class="nav-category">Analytics &amp; Operations</div>

          <a href="mobile-performance-metrics.html" class="nav-link">
            <div class="nav-left">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="20" x2="18" y2="10"></line>
                <line x1="12" y1="20" x2="12" y2="4"></line>
                <line x1="6" y1="20" x2="6" y2="14"></line>
              </svg>
              <span>Performance Metrics</span>
            </div>
          </a>

          <a href="mobile-calendar-picker.html" class="nav-link">
            <div class="nav-left">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                <line x1="16" y1="2" x2="16" y2="6"></line>
                <line x1="8" y1="2" x2="8" y2="6"></line>
                <line x1="3" y1="10" x2="21" y2="10"></line>
              </svg>
              <span>Calendar Date Picker</span>
            </div>
          </a>

          <a href="mobile-scan-product.html" class="nav-link">
            <div class="nav-left">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 7V5a2 2 0 0 1 2-2h2"></path>
                <path d="M17 3h2a2 2 0 0 1 2 2v2"></path>
                <path d="M21 17v2a2 2 0 0 1-2 2h-2"></path>
                <path d="M7 21H5a2 2 0 0 1-2-2v-2"></path>
              </svg>
              <span>Scan Product</span>
            </div>
          </a>

          <a href="mobile-reports-batch.html" class="nav-link">
            <div class="nav-left">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                <polyline points="14 2 14 8 20 8"></polyline>
              </svg>
              <span>Reports &amp; Batches</span>
            </div>
          </a>
        </div>

        <!-- Footer -->
        <div class="drawer-footer">
          <button class="logout-btn" onclick="alert('Logged out'); closeDrawer();">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
              <polyline points="16 17 21 12 16 7"></polyline>
              <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
            <span>Log Out</span>
          </button>
        </div>

      </div>
    </div>
  </div>

  <script>
    function closeDrawer(event) {
      window.location.href = 'mobile-invoice-list.html';
    }
  </script>

</body>
</html>
